<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="color-scheme" content="dark">
<style>html{background-color:#080808}</style>
<script>try{if(sessionStorage.getItem("tea-nav"))document.documentElement.classList.add("nav-in")}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080808'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' fill='%23c4a96b' text-anchor='middle'%3ETEA%3C/text%3E%3C/svg%3E">
<title>Case Study — Thomas Emmanuel Ayodele · TEA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Syne:wght@300;400;500;700&family=Syne+Mono&display=swap" media="print" onload="this.media='all';this.onload=null">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Syne:wght@300;400;500;700&family=Syne+Mono&display=swap"></noscript>
<link rel="stylesheet" href="shared.css?v=3">
<style>
/* ═══ CASE STUDY ═══ */
.cs-hero{position:relative;min-height:88svh;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.06)}
.cs-hero-art{position:absolute;inset:0;z-index:0}
.cs-hero-art svg{width:100%;height:100%;display:block;transform:scale(1.08);transition:transform 2s var(--ease2)}
body.loaded .cs-hero-art svg{transform:scale(1)}
/* Dark enough that the title always clears its background, light enough
   that the artwork is still doing something. */
.cs-hero-veil{position:absolute;inset:0;z-index:1;background:linear-gradient(to top,rgba(8,8,8,.95) 6%,rgba(8,8,8,.4) 48%,rgba(8,8,8,.66) 100%)}
.cs-hero-inner{position:relative;z-index:2;padding:0 60px 72px;width:100%}
.cs-back{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted2);margin-bottom:30px;transition:color .22s,gap .22s}
.cs-back:hover{color:var(--gold);gap:16px}
.cs-title{font-family:var(--serif);font-size:clamp(46px,7.5vw,104px);font-weight:400;line-height:.92;letter-spacing:-.03em;color:var(--off);max-width:14ch}
.cs-title i{font-style:italic;color:var(--gold)}
.cs-tagline{font-family:var(--serif);font-style:italic;font-size:clamp(17px,2.1vw,26px);color:var(--off3);margin-top:22px;max-width:34ch;line-height:1.4}

/* Meta strip */
.cs-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06)}
.cs-meta-cell{background:var(--black);padding:26px 30px}
.cs-meta-k{font-family:var(--mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cs-meta-v{font-size:14px;color:var(--off2);line-height:1.4}

/* Overview */
.cs-overview{padding:110px 60px;display:grid;grid-template-columns:1fr 1.5fr;gap:90px;align-items:start}
.cs-ov-side{position:sticky;top:110px}
.cs-ov-para{font-size:16px;line-height:1.95;color:var(--muted);font-weight:300;margin-bottom:28px}
.cs-ov-para:first-of-type{font-size:19px;color:var(--off3);line-height:1.8}
.cs-ov-para:last-child{margin-bottom:0}
.cs-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.cs-tag{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(196,169,107,.28);padding:4px 11px;border-radius:1px}

/* Approach */
.cs-approach{padding:0 60px 110px;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.06)}
.cs-step{background:var(--black);padding:40px 34px;border-top:2px solid transparent;transition:border-color .35s,background .3s}
.cs-step:hover{border-color:var(--gold);background:var(--black2)}
.cs-step-n{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.16em;display:block;margin-bottom:16px}
.cs-step-t{font-family:var(--serif);font-size:21px;color:var(--off);margin-bottom:11px}
.cs-step-d{font-size:13px;line-height:1.8;color:var(--muted);font-weight:300}

/* Gallery */
.cs-gallery{padding:0 60px 110px;display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.cs-shot{position:relative;overflow:hidden;background:var(--black2)}
.cs-shot.full{grid-column:span 2;aspect-ratio:16/8}
.cs-shot.half{aspect-ratio:4/3}
.cs-shot svg{width:100%;height:100%;display:block;transition:transform 1.1s var(--ease2)}
.cs-shot:hover svg{transform:scale(1.04)}
.cs-cap{position:absolute;left:0;right:0;bottom:0;padding:44px 26px 18px;font-family:var(--mono);font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);background:linear-gradient(to top,rgba(8,8,8,.9),transparent);z-index:1}

/* Palette + type */
.cs-craft{padding:0 60px 110px;display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:start}
.cs-swatches{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.cs-sw{flex:1 1 110px;min-width:110px}
.cs-sw-chip{height:96px;border-radius:2px;border:1px solid rgba(255,255,255,.07);transition:transform .4s var(--ease3)}
.cs-sw:hover .cs-sw-chip{transform:translateY(-6px)}
.cs-sw-name{font-size:12px;color:var(--off2);margin-top:12px}
.cs-sw-hex{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:2px}
.cs-spec{margin-top:34px;border-top:1px solid rgba(255,255,255,.07)}
.cs-spec-row{padding:22px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.cs-spec-k{font-family:var(--mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.cs-spec-serif{font-family:var(--serif);font-size:34px;color:var(--off);line-height:1.1}
.cs-spec-sans{font-family:var(--sans);font-size:22px;color:var(--off2);letter-spacing:.01em}
.cs-spec-note{font-size:13px;line-height:1.85;color:var(--muted);font-weight:300;margin-top:22px}

/* Outcome */
.cs-outcome{background:var(--black2);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.06);padding:76px 60px}
.cs-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:44px;background:rgba(255,255,255,.06)}
.cs-stat{background:var(--black2);padding:34px 30px}
.cs-stat-n{font-family:var(--serif);font-size:48px;color:var(--gold);line-height:1}
.cs-stat-l{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:10px}

/* Prev / next */
.cs-nav{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.06)}
.cs-nav-item{background:var(--black);padding:52px 60px;transition:background .35s;position:relative;overflow:hidden}
.cs-nav-item:hover{background:var(--black2)}
.cs-nav-item.next{text-align:right}
.cs-nav-k{font-family:var(--mono);font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:10px}
.cs-nav-item.next .cs-nav-k{justify-content:flex-end}
.cs-nav-t{font-family:var(--serif);font-size:clamp(22px,2.6vw,34px);color:var(--off);transition:color .25s}
.cs-nav-t i{font-style:italic;color:var(--gold)}
.cs-nav-item:hover .cs-nav-t{color:var(--gold)}
.cs-nav-item.empty{opacity:.32;pointer-events:none}

/* Missing project fallback */
.cs-404{min-height:70svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:140px 24px 90px;gap:22px}
.cs-404-t{font-family:var(--serif);font-size:clamp(30px,4.5vw,52px);color:var(--off);line-height:1.2}
.cs-404-t i{font-style:italic;color:var(--gold)}
.cs-404-s{font-size:14px;color:var(--muted);max-width:44ch;line-height:1.85}

/* ═══ RESPONSIVE ═══ */
@media (max-width:1100px){
  .cs-hero-inner{padding:0 40px 56px}
  .cs-meta-cell{padding:22px 24px}
  .cs-overview{padding:80px 40px;gap:52px;grid-template-columns:1fr 1.4fr}
  .cs-approach,.cs-gallery,.cs-craft{padding-left:40px;padding-right:40px;padding-bottom:80px}
  .cs-craft{gap:48px}
  .cs-outcome{padding:60px 40px}
  .cs-nav-item{padding:42px 40px}
}
@media (max-width:860px){
  .cs-hero{min-height:74svh}
  .cs-hero-inner{padding:0 28px 46px}
  .cs-meta{grid-template-columns:repeat(2,1fr)}
  .cs-overview{grid-template-columns:1fr;gap:32px;padding:60px 28px}
  .cs-ov-side{position:static}
  .cs-approach{grid-template-columns:1fr;padding:0 28px 60px}
  .cs-step{padding:32px 28px}
  .cs-gallery{grid-template-columns:1fr;padding:0 28px 60px}
  .cs-shot.full{grid-column:span 1;aspect-ratio:16/10}
  .cs-craft{grid-template-columns:1fr;padding:0 28px 60px}
  .cs-outcome{padding:52px 28px}
  .cs-stats{grid-template-columns:1fr}
  .cs-nav{grid-template-columns:1fr}
  .cs-nav-item{padding:34px 28px}
  .cs-nav-item.next{text-align:left}
  .cs-nav-item.next .cs-nav-k{justify-content:flex-start}
}
@media (max-width:600px){
  .cs-hero-inner{padding:0 20px 38px}
  .cs-title{max-width:none}
  .cs-meta{grid-template-columns:1fr}
  .cs-meta-cell{padding:18px 20px}
  .cs-overview,.cs-approach,.cs-gallery,.cs-craft{padding-left:20px;padding-right:20px}
  .cs-outcome,.cs-nav-item{padding-left:20px;padding-right:20px}
  .cs-sw{flex:1 1 calc(50% - 7px);min-width:0}
  .cs-sw-chip{height:74px}
  .cs-spec-serif{font-size:27px}
  .cs-stat-n{font-size:38px}
}
</style>
</head>
<body>

<script>
/* Renders one case study from TEA_CONTENT, chosen by ?p=slug.
   Runs before shared.js so the motion layer observes the finished DOM. */
(function () {
  const root = document.getElementById('cs-root');
  const data = window.TEA_CONTENT;
  if (!root || !data) return;

  const slug = new URLSearchParams(location.search).get('p');
  const i = data.projects.findIndex(p => p.slug === slug);

  if (i < 0) {
    root.innerHTML =
      '<section class="cs-404">' +
        '<div class="label" style="justify-content:center">Not found</div>' +
        '<h1 class="cs-404-t">That case study <i>isn\'t here.</i></h1>' +
        '<p class="cs-404-s">The link may be out of date, or the project may not be published yet. The full archive is on the work page.</p>' +
        '<a href="work.html" class="btn-gold magnetic"><span>Browse all work</span></a>' +
      '</section>';
    document.title = 'Not found — Thomas Emmanuel Ayodele · TEA';
    return;
  }

  const p = data.projects[i];
  const prev = data.projects[i - 1];
  const next = data.projects[i + 1];
  document.title = p.plain + ' — Thomas Emmanuel Ayodele · TEA';

  const meta = [
    ['Client', p.client], ['Sector', p.sector], ['Category', p.category], ['Year', p.year]
  ].map(([k, v]) => `<div class="cs-meta-cell"><div class="cs-meta-k">${k}</div><div class="cs-meta-v">${v}</div></div>`).join('');

  const shots = p.sections.map(s => `
    <figure class="cs-shot ${s.span} r">
      ${data.svg(s.motif, p.colors, s.span === 'full' ? 1200 : 600, s.span === 'full' ? 600 : 450)}
      <figcaption class="cs-cap">${s.caption}</figcaption>
    </figure>`).join('');

  const swatches = p.palette.map(c => `
    <div class="cs-sw">
      <div class="cs-sw-chip" style="background:${c.hex}"></div>
      <div class="cs-sw-name">${c.name}</div>
      <div class="cs-sw-hex">${c.hex}</div>
    </div>`).join('');

  const navItem = (proj, kind) => proj
    ? `<a href="project.html?p=${proj.slug}" class="cs-nav-item ${kind}">
         <div class="cs-nav-k">${kind === 'prev' ? '&larr; Previous project' : 'Next project &rarr;'}</div>
         <div class="cs-nav-t">${proj.name}</div>
       </a>`
    : `<div class="cs-nav-item ${kind} empty">
         <div class="cs-nav-k">${kind === 'prev' ? 'Previous project' : 'Next project'}</div>
         <div class="cs-nav-t">Start of the archive</div>
       </div>`;

  root.innerHTML = `
    <section class="cs-hero">
      <div class="cs-hero-art">${data.svg(p.motif, p.colors, 1600, 900)}</div>
      <div class="cs-hero-veil"></div>
      <div class="cs-hero-inner">
        <a href="work.html" class="cs-back">&larr; All work</a>
        <h1 class="cs-title" data-split>${p.name}</h1>
        <p class="cs-tagline r d1">${p.tagline}</p>
      </div>
    </section>

    <div class="cs-meta">${meta}</div>

    <section class="cs-overview spot">
      <div class="cs-ov-side">
        <div class="label r">Overview</div>
        <div class="cs-tags r d1">${p.tags.map(t => `<span class="cs-tag">${t}</span>`).join('')}</div>
      </div>
      <div>${p.overview.map((t, n) => `<p class="cs-ov-para r ${n ? 'd' + Math.min(n, 3) : ''}">${t}</p>`).join('')}</div>
    </section>

    <section class="cs-approach">
      ${p.approach.map(s => `
        <div class="cs-step r">
          <span class="cs-step-n">${s.n}</span>
          <div class="cs-step-t">${s.t}</div>
          <div class="cs-step-d">${s.d}</div>
        </div>`).join('')}
    </section>

    <section class="cs-gallery">${shots}</section>

    <section class="cs-craft">
      <div>
        <div class="label r">Palette</div>
        <div class="cs-swatches r d1">${swatches}</div>
      </div>
      <div>
        <div class="label r">Typography</div>
        <div class="cs-spec r d1">
          <div class="cs-spec-row">
            <div class="cs-spec-k">Display — ${p.type.display}</div>
            <div class="cs-spec-serif">${p.plain}</div>
          </div>
          <div class="cs-spec-row">
            <div class="cs-spec-k">Text — ${p.type.body}</div>
            <div class="cs-spec-sans">ABCDEFGHIJKLM &nbsp;0123456789</div>
          </div>
        </div>
        <p class="cs-spec-note r d2">${p.type.note}</p>
      </div>
    </section>

    <section class="cs-outcome spot">
      <div class="label r">Outcome</div>
      <div class="cs-stats r d1">
        ${p.stats.map(s => `<div class="cs-stat"><div class="cs-stat-n">${s.num}</div><div class="cs-stat-l">${s.label}</div></div>`).join('')}
      </div>
    </section>

    <nav class="cs-nav" aria-label="Project navigation">
      ${navItem(prev, 'prev')}${navItem(next, 'next')}
    </nav>`;
})();
</script>
<script src="shared.js?v=3"></script>
