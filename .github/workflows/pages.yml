name: Deploy site to GitHub Pages

# The site is plain static files at the repo root, so there is nothing to
# build — this just stages the ones that should be published and hands
# them to Pages.
#
# ONE-TIME SETUP: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". This workflow cannot do it for you. Creating the Pages
# site is a POST /repos/{owner}/{repo}/pages call, and GITHUB_TOKEN is a
# GitHub App installation token, which that endpoint refuses with
# "Resource not accessible by integration" — the pages:write permission
# below covers deploying to an existing site, not creating one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # No `enablement: true` — it cannot work with GITHUB_TOKEN (see the
        # note at the top of this file). Once Pages is switched on in the
        # repository settings this step just reads the existing config.
        uses: actions/configure-pages@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp ./*.html shared.css shared.js content.js _site/
          # Only the directories the site actually links to. assets/projects
          # holds the full-size originals the WebP variants in assets/img
          # were derived from — 6.6MB nothing on the site requests.
          mkdir -p _site/assets
          cp -r assets/img assets/images _site/assets/
          # Pages runs Jekyll by default, which would skip files it does
          # not recognise. This opts out and publishes the tree as-is.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
