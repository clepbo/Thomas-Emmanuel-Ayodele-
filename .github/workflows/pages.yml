name: Deploy site to GitHub Pages

# The site is plain static files at the repo root, so there is nothing to
# build — this just stages the ones that should be published and hands
# them to Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Pages only serves private repositories on paid plans, so on a
    # free plan the very first step fails with "Resource not accessible by
    # integration" and every push to main gets a red cross for a reason
    # nobody can act on from here. Skipping while the repo is private keeps
    # the run green, and the deploy starts happening on its own the moment
    # the repo is made public.
    if: ${{ !github.event.repository.private }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on via the API on the first run, so the
        # repository settings do not have to be touched by hand.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site
        run: |
          mkdir -p _site
          cp ./*.html shared.css shared.js _site/
          cp -r assets _site/
          # Pages runs Jekyll by default, which would skip files it does
          # not recognise. This opts out and publishes the tree as-is.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
