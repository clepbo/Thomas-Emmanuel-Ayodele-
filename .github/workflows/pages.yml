name: Deploy site to GitHub Pages

# The site is plain static files at the repo root, so there is nothing to
# build — this just stages the ones that should be published and hands
# them to Pages.
#
# This is the Actions-deployment publisher, used when Source is set to
# "GitHub Actions". There is a second one — .github/workflows/gh-pages.yml —
# that publishes to a `gh-pages` branch instead, for when this pipeline
# stalls. Only the one matching the configured Source does anything.
#
# ONE-TIME SETUP: Settings -> Pages -> Build and deployment -> Source ->
# "GitHub Actions". This workflow cannot do it for you. Creating the Pages
# site is a POST /repos/{owner}/{repo}/pages call, and GITHUB_TOKEN is a
# GitHub App installation token, which that endpoint refuses with
# "Resource not accessible by integration" — the pages:write permission
# below covers deploying to an existing site, not creating one.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # No `enablement: true` — it cannot work with GITHUB_TOKEN (see the
        # note at the top of this file). Once Pages is switched on in the
        # repository settings this step just reads the existing config.
        uses: actions/configure-pages@v5

      - name: Assemble site
        # Shared with .github/workflows/gh-pages.yml so the two publishing
        # paths cannot disagree about which files reach the web.
        run: tools/build-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        # Do not try to raise `timeout` past 600000 — that is a hard cap in
        # the action, and anything larger is silently clamped back to it
        # with only a warning ("timeout value is greater than the allowed
        # maximum"). If a deploy dies on "Timeout reached, aborting!" after
        # ten minutes of `deployment_queued`, Pages is sitting on the
        # deployment and the fix is to re-run, not to wait longer.
        uses: actions/deploy-pages@v4
